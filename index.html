<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03191c">
<title>Fyndset — Don't apply. Get found.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#03191c;color:white;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.hero{position:relative;width:100%;min-height:100svh;overflow:hidden;background:#03191c}
.art{position:absolute;inset:0;background:url("fyndset-hero-approved.png") center top/cover no-repeat}
.overlay{position:absolute;inset:0}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:999px}
.hot:focus-visible{outline:3px solid #26d7d0;outline-offset:3px}
.be{left:5.6%;top:23.8%;width:13.8%;height:3.4%}.find{left:21.5%;top:23.8%;width:14%;height:3.4%}
.mobile-ui{display:none}
@media(max-width:700px){
 .hero{min-height:100svh;background:#03191c}
 .art{background-position:61% top;background-size:auto 100svh;filter:brightness(.82)}
 .overlay{background:linear-gradient(180deg,rgba(1,18,21,.18),rgba(1,18,21,.08) 40%,#03191c 79%)}
 .be,.find{display:none}
 .mobile-ui{display:flex;position:absolute;z-index:4;inset:0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));flex-direction:column}
 .m-top{display:flex;align-items:center;justify-content:space-between}
 .m-logo{font-size:23px;font-weight:850;letter-spacing:-1.1px}.m-logo i{font-style:normal;color:#25d5cf}
 .menu{font-size:24px}
 .m-copy{margin-top:15vh;text-align:center;text-shadow:0 2px 18px #0008}
 .m-kicker{font-size:9px;letter-spacing:.23em;text-transform:uppercase;color:#d0dfdd}
 .m-copy h1{font-size:53px;line-height:.91;letter-spacing:-3px;margin:15px 0 14px;font-weight:650}
 .m-copy h1 span{color:#25d5cf}
 .m-copy p{margin:0;color:#e4eceb;font-size:15px}
 .talent-card{margin:10vh auto 0;width:min(275px,85vw);padding:13px;background:rgba(3,27,30,.76);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(18px);border-radius:17px;display:grid;grid-template-columns:50px 1fr;gap:11px;box-shadow:0 20px 60px #0006}
 .face{width:50px;height:50px;border-radius:11px;background:linear-gradient(145deg,#e1bfa6,#7a5748 45%,#123a3b)}
 .talent-card b{font-size:12px}.talent-card small{display:block;color:#b8cac7;font-size:9px;margin-top:3px}.verified{color:#58e6a2}
 .choice{margin-top:auto;background:rgba(3,25,28,.78);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(20px);border-radius:22px;padding:17px}
 .choice h3{font-size:17px;margin:0 0 11px}
 .choice button{width:100%;border:0;border-radius:13px;background:#f7fbfa;color:#06272a;padding:14px 16px;text-align:left;font-weight:750;margin-top:8px}
 .choice button span{float:right}
}
</style>
</head>
<body>
<main class="hero">
 <div class="art" aria-hidden="true"></div><div class="overlay"></div>
 <button class="hot be" aria-label="Be found" onclick="alert('Percurso profissional — próxima fase')"></button>
 <button class="hot find" aria-label="Find talent" onclick="alert('Pesquisa de talento — próxima fase')"></button>
 <section class="mobile-ui">
   <div class="m-top"><div class="m-logo">fyndset<i>.</i></div><div class="menu">☰</div></div>
   <div class="m-copy"><div class="m-kicker">Hospitality talent. Reimagined.</div><h1>Don’t apply.<br><span>Get found.</span></h1><p>A tua carreira fala por ti.</p></div>
   <div class="talent-card"><div class="face"></div><div><b>Inês Martins <span class="verified">●</span></b><small>Restaurant Manager</small><small>Lisbon · 8 years</small><small class="verified">✓ Verified experience</small></div></div>
   <div class="choice"><h3>What brings you here?</h3><button>Be found <span>→</span></button><button>Find talent <span>→</span></button></div>
 </section>
</main>
</body></html>
